<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icon-16.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!--
      Dos metas por esquema en vez de una sola: iOS lee theme-color al lanzar la
      PWA instalada (antes de que corra JS) y pinta con ese color la franja de la
      barra de estado. Con un único valor claro, el modo oscuro arrancaba con una
      banda blanca arriba del topbar. El CSP prohíbe scripts inline, así que no
      hay forma de resolver el tema antes del primer pintado: las media queries
      cubren el caso 'auto' y theme.ts (applyResolvedTheme) sobreescribe ambas
      cuando el usuario fuerza claro/oscuro.
      El valor oscuro es el rgb(24,24,24) del fondo de .topbar, no --bg (#000),
      para que la franja y el topbar se lean como una sola superficie.
    -->
    <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#181818" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <!--
      Cloudflare serves this file directly from the assets binding (before the
      Worker's fetch handler runs), so the CSP/Referrer-Policy set in
      worker/src/index.ts for /billzzz-api/* responses never reaches this
      document — set here instead. frame-ancestors and report-* only work as
      an HTTP header, not via meta, so they're intentionally left off here.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; manifest-src 'self'; base-uri 'self'; form-action 'self'"
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="description" content="Gestiona tus suscripciones y fechas de pago" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Billzzz" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icon-180.png" />

    <title>Billzzz</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

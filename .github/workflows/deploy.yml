name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Deploy or skip if secrets missing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::Deploy omitido: falta CLOUDFLARE_API_TOKEN en GitHub."
            echo ""
            echo "Configura con: ./scripts/setup-github-secrets.sh"
            echo "Guía: docs/DEPLOY.md"
            exit 0
          fi

          ACCOUNT_ID="$(echo "${CLOUDFLARE_ACCOUNT_ID:-}" | tr -d '[:space:]')"

          if [ -z "$ACCOUNT_ID" ]; then
            WHOAMI_OUTPUT="$(npx wrangler whoami 2>&1 || true)"
            ACCOUNT_ID="$(echo "$WHOAMI_OUTPUT" | grep -oE '[a-fA-F0-9]{32}' | head -1 || true)"
            if [ -z "$ACCOUNT_ID" ]; then
              echo "::error::Falta CLOUDFLARE_ACCOUNT_ID en GitHub secrets y wrangler whoami no devolvió Account ID."
              echo ""
              echo "Configura ambos secrets con: ./scripts/setup-github-secrets.sh"
              echo ""
              echo "Salida de wrangler whoami:"
              echo "$WHOAMI_OUTPUT"
              exit 1
            fi
            echo "Account ID resuelto desde wrangler whoami: ${ACCOUNT_ID:0:8}…"
          else
            echo "Account ID desde GitHub secret: ${ACCOUNT_ID:0:8}…"
          fi

          if ! echo "$ACCOUNT_ID" | grep -qE '^[a-fA-F0-9]{32}$'; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID inválido (debe ser 32 caracteres hex)."
            exit 1
          fi

          export CLOUDFLARE_ACCOUNT_ID="$ACCOUNT_ID"

          echo "→ Migraciones D1"
          npx wrangler d1 migrations apply bills-pwa-db --remote

          echo "→ Deploy"
          npx wrangler deploy

name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Validate
        run: npm run validate

      - name: Build
        run: npm run build

      - name: Deploy or skip if secrets missing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::Deploy omitido: falta CLOUDFLARE_API_TOKEN en GitHub."
            echo ""
            echo "Configura con: ./scripts/setup-github-secrets.sh"
            echo "Guía: docs/DEPLOY.md"
            exit 0
          fi

          ACCOUNT_ID="$(echo "${CLOUDFLARE_ACCOUNT_ID:-}" | tr -d '[:space:]')"
          WHOAMI_OUTPUT=""

          if ! echo "$ACCOUNT_ID" | grep -qE '^[a-fA-F0-9]{32}$'; then
            if [ -n "$ACCOUNT_ID" ]; then
              echo "::warning::CLOUDFLARE_ACCOUNT_ID en GitHub no es válido; intentando wrangler whoami…"
            fi
            WHOAMI_OUTPUT="$(npx wrangler whoami 2>&1 || true)"
            ACCOUNT_ID="$(echo "$WHOAMI_OUTPUT" | grep -oE '[a-fA-F0-9]{32}' | head -1 || true)"
          fi

          if [ -z "$ACCOUNT_ID" ] || ! echo "$ACCOUNT_ID" | grep -qE '^[a-fA-F0-9]{32}$'; then
            echo "::error::No se pudo obtener un Account ID válido de Cloudflare."
            echo ""
            echo "Configura los secrets con: ./scripts/setup-github-secrets.sh"
            echo "Account ID = 32 caracteres hex desde: npx wrangler whoami"
            echo ""
            if [ -n "$WHOAMI_OUTPUT" ]; then
              echo "Salida de wrangler whoami:"
              echo "$WHOAMI_OUTPUT"
            fi
            exit 1
          fi

          export CLOUDFLARE_ACCOUNT_ID="$ACCOUNT_ID"
          echo "Account ID: ${ACCOUNT_ID:0:8}…"

          echo "→ Migraciones D1"
          npx wrangler d1 migrations apply bills-pwa-db --remote

          echo "→ Deploy"
          npx wrangler deploy
          npm run postdeploy:smoke

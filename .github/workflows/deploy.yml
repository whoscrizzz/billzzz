name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Deploy or skip if secrets missing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::Deploy omitido: faltan secrets de Cloudflare en GitHub."
            echo ""
            echo "Configura una sola vez (desde tu Mac, con gh auth login):"
            echo "  ./scripts/setup-github-secrets.sh"
            echo ""
            echo "O manualmente: https://github.com/${{ github.repository }}/settings/secrets/actions"
            echo "  CLOUDFLARE_API_TOKEN  — token Edit Cloudflare Workers"
            echo "  CLOUDFLARE_ACCOUNT_ID — panel Cloudflare → Workers & Pages"
            echo ""
            echo "Guía: docs/DEPLOY.md"
            exit 0
          fi

          echo "Secrets OK — aplicando migraciones y desplegando…"
          npx wrangler d1 migrations apply bills-pwa-db --remote
          npx wrangler deploy

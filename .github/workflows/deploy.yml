name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Validate
        run: npm run validate

      - name: Build
        run: npm run build

      - name: Block automatic deploy when D1 migrations changed
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || echo "$BEFORE" | grep -qE '^0+$'; then
            echo "No previous commit available; skipping migration diff guard."
            exit 0
          fi
          if ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            if ! git fetch --no-tags origin "$BEFORE"; then
              echo "::error::No se pudo obtener el commit previo $BEFORE para verificar cambios en migrations/."
              exit 1
            fi
          fi
          if ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "::error::No se pudo resolver el commit previo $BEFORE para verificar cambios en migrations/."
            exit 1
          fi
          CHANGED="$(git diff --name-only "$BEFORE" "${{ github.sha }}" -- migrations migrations-v1)"
          if [ -n "$CHANGED" ]; then
            echo "::error::Este push cambia migraciones D1. El deploy automático se bloquea para no publicar código antes de migrar producción."
            echo "$CHANGED"
            echo "Ejecuta primero: CONFIRM_D1_PROD_MIGRATION=bills-pwa-db npm run db:migrate:production"
            exit 1
          fi

      - name: Deploy or skip if secrets missing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          source scripts/sanitize-cf-secret.sh

          # Cuenta canónica bills-pwa (no es secreto; fallback si el secret de GitHub está mal pegado)
          KNOWN_ACCOUNT_ID="52d15acf04ee2011dfec85dc8240dc67"

          CLOUDFLARE_API_TOKEN="$(sanitize "${CLOUDFLARE_API_TOKEN:-}")"

          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::Deploy omitido: falta CLOUDFLARE_API_TOKEN en GitHub."
            echo ""
            echo "Configura con: ./scripts/setup-github-secrets.sh"
            echo "Guía: docs/DEPLOY.md"
            {
              echo "## ⚠️ Deploy omitido — falta \`CLOUDFLARE_API_TOKEN\`"
              echo ""
              echo "Configura con: \`./scripts/setup-github-secrets.sh\`"
              echo ""
              echo "Guía: [docs/DEPLOY.md](docs/DEPLOY.md)"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ "${#CLOUDFLARE_API_TOKEN}" -lt 30 ]; then
            echo "::error::CLOUDFLARE_API_TOKEN demasiado corto (${#CLOUDFLARE_API_TOKEN} chars)."
            echo "Usa un API Token de Cloudflare (Edit Cloudflare Workers), no la contraseña de login."
            echo "Configura con: ./scripts/setup-github-secrets.sh"
            exit 1
          fi

          if printf '%s' "$CLOUDFLARE_API_TOKEN" | grep -q '[[:space:]]'; then
            echo "::error::CLOUDFLARE_API_TOKEN contiene espacios. Vuelve a pegarlo sin comillas ni saltos de línea."
            exit 1
          fi

          export CLOUDFLARE_API_TOKEN

          ACCOUNT_ID="$(sanitize "${CLOUDFLARE_ACCOUNT_ID:-}")"
          WHOAMI_OUTPUT=""

          if ! echo "$ACCOUNT_ID" | grep -qE '^[a-fA-F0-9]{32}$'; then
            if [ -n "$ACCOUNT_ID" ]; then
              echo "::warning::CLOUDFLARE_ACCOUNT_ID en GitHub no es válido; probando whoami y fallback conocido…"
            fi
            WHOAMI_OUTPUT="$(npx wrangler whoami 2>&1 || true)"
            ACCOUNT_ID="$(echo "$WHOAMI_OUTPUT" | grep -oE '[a-fA-F0-9]{32}' | head -1 || true)"
          fi

          if [ -z "$ACCOUNT_ID" ] || ! echo "$ACCOUNT_ID" | grep -qE '^[a-fA-F0-9]{32}$'; then
            echo "::warning::Usando Account ID canónico del repo (secret inválido o whoami falló)."
            ACCOUNT_ID="$KNOWN_ACCOUNT_ID"
          fi

          export CLOUDFLARE_ACCOUNT_ID="$ACCOUNT_ID"
          echo "Account ID: ${ACCOUNT_ID:0:8}…"

          echo "→ Verificando token…"
          if ! npx wrangler whoami >/dev/null 2>&1; then
            echo "::error::CLOUDFLARE_API_TOKEN rechazado por Cloudflare (6111 = formato inválido o token revocado)."
            echo ""
            echo "Crea un token nuevo: https://dash.cloudflare.com/profile/api-tokens"
            echo "  → Create Token → «Edit Cloudflare Workers»"
            echo "Pega el token SIN comillas: ./scripts/setup-github-secrets.sh"
            if [ -n "$WHOAMI_OUTPUT" ]; then
              echo ""
              echo "Salida wrangler whoami:"
              echo "$WHOAMI_OUTPUT"
            fi
            exit 1
          fi

          echo "→ Migraciones D1 omitidas: deploy no modifica datos."
          echo "   Ejecuta migraciones prod manualmente con npm run db:migrate:production."

          echo "→ Deploy"
          npx wrangler deploy

          echo "→ Smoke"
          npm run postdeploy:smoke

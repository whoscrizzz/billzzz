name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Deploy or skip if secrets missing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::Deploy omitido: falta CLOUDFLARE_API_TOKEN en GitHub."
            echo ""
            echo "Configura con: ./scripts/setup-github-secrets.sh"
            echo "Guía: docs/DEPLOY.md"
            exit 0
          fi

          RESOLVED_ACCOUNT_ID="$(npx wrangler whoami 2>/dev/null | grep -oE '[a-f0-9]{32}' | head -1 || true)"
          if [ -z "$RESOLVED_ACCOUNT_ID" ]; then
            echo "::error::Token inválido o sin permisos. Crea uno nuevo: Edit Cloudflare Workers"
            exit 1
          fi

          export CLOUDFLARE_ACCOUNT_ID="$RESOLVED_ACCOUNT_ID"
          echo "Account ID resuelto desde API: ${CLOUDFLARE_ACCOUNT_ID:0:8}…"

          echo "→ Migraciones D1"
          npx wrangler d1 migrations apply bills-pwa-db --remote

          echo "→ Deploy"
          npx wrangler deploy

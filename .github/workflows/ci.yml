name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Audit dependencies
        # Solo deps de producción: las de dev/build (wrangler, sharp, vite…) no se
        # despachan a usuarios y acumulan advisories sin fix upstream, rompiendo el
        # gate por ruido. El árbol de producción es lo que importa auditar en cada PR.
        run: npm audit --audit-level=high --omit=dev

      - name: Validate
        run: npm run validate

      - name: Build
        run: npm run build
